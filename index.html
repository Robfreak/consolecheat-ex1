<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Title-ID-Finder · consolecheat</title>
    <meta
      name="description"
      content="Title-IDs für PS4 (CUSA) und PS5 (PPSA) suchen. Mit Region, ohne Anmeldung. Inoffiziell, nicht von Sony."
    />
    <meta name="theme-color" content="#07090e" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap"
    />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("consolecheat-theme");
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = t;
          var c = t === "light" ? "#f4f1eb" : "#07090e";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", c);
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
